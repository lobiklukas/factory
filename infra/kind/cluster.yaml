# The local Kubernetes tier (docs/design.md D4, M4): one kind node, nothing else.
#
# One control-plane node that also schedules the sandboxes. kind's default local-path provisioner
# backs every PVC with a directory on that node, so a workspace really outlives the pod it was
# written from (LOB-91). The node image is pinned by digest — kind v0.33.0's default — so the cluster
# is the same on every machine. No RuntimeClass, no gVisor: kind nodes are containers, so a sandbox
# here is isolated from nothing (R2), and the runtime says `isolation: "none"`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: factory-sandbox
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
