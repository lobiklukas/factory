<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The same glyph as src/components/factory-mark.tsx. A favicon cannot inherit
    `currentColor` or the app's class-based theme, so this file carries its own
    prefers-color-scheme block and the two copies of the path have to stay
    identical. Change one, change the other.
  -->
  <style>
    rect { fill: #ffffff; }
    path { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      rect { fill: #0a0a0a; }
      path { fill: #f5f5f5; }
    }
  </style>
  <rect width="32" height="32" />
  <path d="M10 8h13v4h-8.5v3.5H22v4h-7.5V24H10z" />
</svg>
