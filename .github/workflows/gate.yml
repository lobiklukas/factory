# The gate AGENTS.md asks for, one job per command so a failure names its cause. Runs on every PR and
# on main. The `gate` job at the bottom is the single check to look at: it fails if any job failed.
# `gate` is the required check on main: ralph PRs auto-merge when it passes, a red one is sent back to
# the loop to fix (.pi/ralph/work.prompt.md), and a red main becomes a Linear ticket.
name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run lint

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run type-check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run build # Effect diagnostics run with denyWarnings: a warning fails here

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine # Docker Hub rate-limits unauthenticated pulls from shared runners
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5442:5432 # the port the suites default to (compose.yaml)
        options: >-
          --health-cmd "pg_isready -U factory -d factory"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test

  gate:
    if: always()
    needs: [format, lint, type-check, build, test]
    runs-on: ubuntu-latest
    steps:
      - name: every job must have succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
